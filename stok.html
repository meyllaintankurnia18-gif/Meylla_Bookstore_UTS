<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Katalog Buku | Meylla Bookstore</title><link rel="stylesheet" href="css/style.css"><script src="js/data.js" defer></script><script src="js/script.js" defer></script></head>
<body>
<header class="topbar"><a class="brand brand-dark" href="dashboard.html"><span class="brand-icon">M</span><span>Meylla <b>Bookstore</b></span></a><nav><a href="dashboard.html">Dashboard</a><a class="active" href="stok.html">Katalog</a><a href="checkout.html">Pemesanan</a><a href="tracking.html">Pengiriman</a></nav><button class="btn btn-outline btn-small" data-logout>Keluar</button></header>
<main class="container">
  <div class="page-title"><div><span class="eyebrow">KOLEKSI PILIHAN</span><h1>Stok & Katalog Buku</h1><p class="muted">Temukan buku yang cocok untuk menemani harimu.</p></div><a class="btn btn-primary" href="checkout.html">Lihat Pesanan →</a></div>
  <div class="toolbar"><input id="searchBook" type="search" placeholder="Cari judul atau penulis buku..."><span id="bookCount" class="muted"></span></div>
  <section id="catalogGrid" class="book-grid" aria-live="polite"></section>
  <section class="form-card add-book-card"><div class="section-heading"><div><span class="eyebrow">KELOLA DATA</span><h2>Tambah Stok Buku</h2><p class="muted">Data baru akan ditambahkan ke katalog pada browser ini.</p></div></div>
    <form id="addBookForm" class="form-grid"><div><label>Judul Buku</label><input id="newTitle" required placeholder="Contoh: Negeri 5 Menara"></div><div><label>Penulis</label><input id="newAuthor" required placeholder="Nama penulis"></div><div><label>Harga (Rp)</label><input id="newPrice" type="number" min="1" required placeholder="75000"></div><div><label>Stok</label><input id="newStock" type="number" min="0" required placeholder="10"></div><button class="btn btn-primary" type="submit">+ Tambahkan Buku</button></form>
  </section>
</main><footer class="footer">© 2026 Meylla Bookstore</footer></body></html>
